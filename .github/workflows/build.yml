name: Build InputStream Vivid
on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    name: Build Linux-aarch64
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: aarch64
            cmake-args: -DCMAKE_SYSTEM_NAME=Linux -DCMAKE_SYSTEM_PROCESSOR=aarch64 -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++

    steps:
      - uses: actions/checkout@v4

      # 下载 Kodi 22 Piers 源码（提供 kodi-dev-kit 头文件）
      - name: Checkout Kodi Source
        uses: actions/checkout@v4
        with:
          repository: xbmc/xbmc
          ref: Piers
          path: kodi_src
          fetch-depth: 1

      # 安装 aarch64 交叉编译工具链
      # ubuntu-latest 自带 cmake/g++，只需补交叉工具链；
      # 加 Timeout/Retries，避免 apt 镜像抖动导致作业长时间挂住。
      - name: Install Linux Build Tools
        run: |
          sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=30 || true
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            -o Acquire::Retries=3 -o Acquire::http::Timeout=30 \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu binutils-aarch64-linux-gnu

      # 配置并编译
      - name: Configure and Build
        shell: bash
        run: |
          cmake -B build -S . \
            -DKODI_SOURCE_DIR=${{ github.workspace }}/kodi_src \
            ${{ matrix.cmake-args }}
          cmake --build build --config Release --parallel

      # 校验产物架构，防止误产出 32 位或本机架构
      # 注意：必须硬断言，只打印不断言的话架构错了也会"通过"
      - name: Verify ELF architecture
        shell: bash
        run: |
          set -e
          echo "--- 目标文件（证明源码确实被编译过）---"
          find build -name "*.o" -exec ls -l {} \;
          SO=$(find build -name "*.so" | head -n1)
          if [ -z "$SO" ]; then echo "FAIL: 没有产出 .so"; exit 1; fi
          echo "artifact: $SO"
          INFO=$(aarch64-linux-gnu-readelf -h "$SO")
          echo "$INFO" | grep -E "Class|Machine|Type"
          echo "$INFO" | grep -q "ELF64"     || { echo "FAIL: 不是 64 位 ELF"; exit 1; }
          echo "$INFO" | grep -q "AArch64"   || { echo "FAIL: 不是 AArch64"; exit 1; }
          echo "OK: ELF64 / AArch64"

          SIZE=$(stat -c%s "$SO")
          echo "size: $SIZE bytes"
          [ "$SIZE" -gt 10000 ] || { echo "FAIL: .so 过小，疑似空壳"; exit 1; }
          sha256sum "$SO"

          # 必须导出 Kodi 二进制插件的三个入口符号
          SYMS=$(aarch64-linux-gnu-nm -D --defined-only "$SO")
          for s in ADDON_Create ADDON_GetTypeVersion ADDON_GetTypeMinVersion; do
            echo "$SYMS" | grep -qw "$s" || { echo "FAIL: 缺少导出符号 $s"; exit 1; }
          done
          echo "OK: 已导出 ADDON_Create / ADDON_GetTypeVersion / ADDON_GetTypeMinVersion"

      # 校验 addon.xml 里 Kodi 真正会读的那几个字段
      - name: Verify addon.xml
        shell: bash
        run: |
          set -e
          python3 - <<'EOF'
          import sys, xml.etree.ElementTree as ET
          r = ET.parse('addon.xml').getroot()
          exts = r.findall('extension')
          isx = [e for e in exts if e.get('point') == 'kodi.inputstream']
          if not isx:
              print('FAIL: 没有 point="kodi.inputstream" 的 extension'); sys.exit(1)
          e = isx[0]
          if not e.get('library_linux'):
              print('FAIL: inputstream 扩展缺少 library_linux 属性'); sys.exit(1)
          # platform 属于 xbmc.addon.metadata 扩展下的子元素
          plats = [p.text or '' for p in r.iter('platform')]
          if not any('linux-aarch64' in p for p in plats):
              print('FAIL: platform 未声明 linux-aarch64，实际为 %r' % plats); sys.exit(1)
          print('OK: point=kodi.inputstream library_linux=%s platform=%s' % (e.get('library_linux'), plats))
          EOF

      # 打包
      - name: Prepare Artifacts
        shell: bash
        run: |
          ADDON_ID="inputstream.vivid"
          mkdir -p $ADDON_ID
          cp addon.xml $ADDON_ID/
          find build -name "*.so" -exec cp {} $ADDON_ID/$ADDON_ID.so \;
          mkdir -p staging
          mv $ADDON_ID staging/

      # 上传
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: inputstream.vivid-linux-aarch64
          path: staging/
